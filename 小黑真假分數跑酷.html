<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小黑分數跑酷</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff3e0;--org:#f5a82e;--blue:#5cc8ff;--pink:#ff6b8b;--ink:#2a1636;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--cream);background:linear-gradient(#2d1b4a 0%,#8c4f78 30%,#e8909a 48%,#ffb36b 58%,#6a4a6e 59%,#2a1d3d 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4vh 5vw;background:linear-gradient(90deg,rgba(30,15,45,.78),rgba(30,15,45,.25) 70%,transparent);overflow:auto}
.ov.hide,.hide{display:none}
.kick{color:var(--org);font-weight:900;letter-spacing:.06em;font-size:clamp(14px,1.6vw,22px)}
.title{display:flex;align-items:center;flex-wrap:wrap;gap:2vw;margin:.5vh 0}
h1{margin:0;font-weight:900;font-size:clamp(90px,15vw,210px);line-height:1;color:var(--cream)}
.tag{background:var(--org);color:var(--ink);font-weight:900;font-size:clamp(28px,4.4vw,64px);padding:.15em .45em;border-radius:14px;transform:rotate(-4deg);box-shadow:0 8px 0 #c47f10}
.desc{font-weight:700;font-size:clamp(15px,1.7vw,24px);line-height:1.8;max-width:900px;margin:1vh 0 2.5vh}
.desc b{color:var(--org)}
.cards{display:flex;gap:1.4vw;flex-wrap:wrap;max-width:1200px}
.card{flex:1 1 240px;max-width:380px;text-align:left;font:inherit;color:var(--cream);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:18px 22px;cursor:pointer;backdrop-filter:blur(4px);transition:transform .15s,background .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px);background:rgba(255,255,255,.2);outline:2px solid var(--cream)}
.card h3{margin:0 0 6px;font-size:clamp(20px,2vw,28px);font-weight:900}
.card p{margin:0;font-weight:700;font-size:clamp(14px,1.3vw,18px);line-height:1.7;opacity:.9}
.keys{margin-top:2.5vh;font-weight:700;font-size:clamp(14px,1.4vw,19px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
kbd{display:inline-block;min-width:44px;text-align:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-bottom-width:4px;font:inherit;font-weight:900}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
#hud .l{font-weight:900;font-size:clamp(16px,2vw,24px);text-shadow:0 2px 6px #000a}
#hint{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:clamp(14px,1.8vw,20px)}#hint span{padding:5px 12px;border-radius:10px;width:fit-content;color:#fff}#hint .y{background:#2f9e5f}#hint .n{background:#d6455f}#hint small{font-weight:700;opacity:.9;margin-left:6px;font-size:.8em}#hearts{color:var(--pink);font-size:clamp(22px,3vw,34px);letter-spacing:.1em;text-shadow:0 2px 6px #000a}
#slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(560px,60vw)}
.slot{min-width:clamp(34px,4.4vw,54px);height:clamp(30px,3.6vw,42px);border-radius:10px;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;font-weight:900;font-size:clamp(11px,1.3vw,16px);background:rgba(0,0,0,.25)}
.slot.on{background:var(--org);color:var(--ink);border:2px solid #fff3;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:12px 22px;border-radius:16px;font-weight:900;font-size:clamp(16px,2.2vw,28px);text-align:center;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.good{background:#2f9e5f}#toast.bad{background:#d6455f}
#pad{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 18px}
#pad button{width:96px;height:96px;border-radius:50%;border:3px solid #fff5;background:rgba(255,255,255,.16);color:var(--cream);font-size:40px;font-weight:900}
@media (pointer:coarse){#pad.on{display:flex}}
#end{background:rgba(25,12,40,.72);align-items:center;text-align:center}
#end h2{font-size:clamp(44px,8vw,96px);margin:0;font-weight:900}
#end p{font-weight:700;font-size:clamp(16px,2vw,26px);max-width:700px;line-height:1.8}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;border:0;cursor:pointer;background:var(--org);color:var(--ink);box-shadow:0 5px 0 #c47f10}
.btn.g{background:rgba(255,255,255,.18);color:var(--cream);box-shadow:none;border:1px solid #fff5}
.btn:focus-visible{outline:3px solid #fff}
@media (prefers-reduced-motion:reduce){.slot.on{animation:none}}
</style>
</head>
<body>
<div id="hud" class="hide"><div class="l"><div id="lvname"></div><div id="hearts"></div><div id="hint"><span class="y">吃真分數 <small>分子&lt;分母</small></span><span class="n">避開假分數 <small>分子≥分母</small></span></div></div><div id="slots"></div></div>
<div id="toast"></div>
<div id="pad"><button id="bl" aria-label="往左">◀</button><button id="br" aria-label="往右">▶</button></div>

<section id="menu" class="ov">
  <div class="kick">FRACTION RUN ▪ 屋頂跑酷</div>
  <div class="title"><h1>小黑</h1><div class="tag">分數跑酷</div></div>
  <p class="desc">一隻在夕陽屋頂上奔跑的黑狗。左右換道,<b>只吃真分數金幣</b>(分子比分母小,例如 3/5),分子大於或等於分母的<b>假分數</b>(例如 7/4、5/5)要閃開。收集齊<b>真分數金幣</b>就過關(初級 5 枚,中級、高級 10 枚)!</p>
  <div class="cards">
    <button class="card" data-lv="1"><h3 style="color:var(--org)">初級</h3><p>速度慢,一次一枚金幣,看清楚再吃。</p></button>
    <button class="card" data-lv="2"><h3 style="color:var(--blue)">中級</h3><p>速度加快,一次兩枚,選出真分數那一枚。</p></button>
    <button class="card" data-lv="3"><h3 style="color:var(--pink)">高級</h3><p>速度最快,一次三枚,只有一枚是真分數。</p></button>
  </div>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 換跑道 <span style="opacity:.85">手機:左右滑動,或點左右按鈕</span></div>
</section>

<section id="end" class="ov hide">
  <h2 id="etitle"></h2><p id="emsg"></p>
  <div class="btns"><button class="btn" id="again">再玩一次</button><button class="btn g" id="home">回到選單</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var LV={1:{name:'初級',goal:5,speed:9,per:1,gap:24,dmax:6},2:{name:'中級',goal:10,speed:13,per:2,gap:30,dmax:9},3:{name:'高級',goal:10,speed:17,per:3,gap:34,dmax:12}};
var LANES=[-2.4,0,2.4];
var $=function(i){return document.getElementById(i)};
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.insertBefore(renderer.domElement,document.body.firstChild);
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe8909a,35,175);
var camera=new THREE.PerspectiveCamera(60,1,.1,500);
camera.position.set(0,4,8);camera.lookAt(0,1.6,-15);
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w/h<1?78:60;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffc9b0,0x3a2650,.9));
var sunL=new THREE.DirectionalLight(0xffb27a,.9);sunL.position.set(0,10,-30);scene.add(sunL);

// sun glow
(function(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');var g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(255,250,220,1)');g.addColorStop(.25,'rgba(255,200,130,.8)');g.addColorStop(1,'rgba(255,150,120,0)');x.fillStyle=g;x.fillRect(0,0,256,256);
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(130,130,1);s.position.set(0,12,-190);scene.add(s)})();

// road
var road=new THREE.Mesh(new THREE.PlaneGeometry(7.8,500),new THREE.MeshLambertMaterial({color:0x4a3a5e}));
road.rotation.x=-Math.PI/2;road.position.z=-200;scene.add(road);
[-1,1].forEach(function(s){
  var w=new THREE.Mesh(new THREE.BoxGeometry(.6,1,500),new THREE.MeshLambertMaterial({color:0xb99ab8}));w.position.set(s*4.2,.5,-200);scene.add(w);
  var e=new THREE.Mesh(new THREE.BoxGeometry(.14,.02,500),new THREE.MeshBasicMaterial({color:0xf3e8f0}));e.position.set(s*3.6,.02,-200);scene.add(e);
});
var dashes=[];
[-1.2,1.2].forEach(function(x){for(var i=0;i<24;i++){var d=new THREE.Mesh(new THREE.BoxGeometry(.14,.02,3),new THREE.MeshBasicMaterial({color:0xf3e8f0}));d.position.set(x,.02,10-i*8);scene.add(d);dashes.push(d)}});

// buildings
function winTex(){var c=document.createElement('canvas');c.width=64;c.height=128;var x=c.getContext('2d');x.fillStyle='#241a38';x.fillRect(0,0,64,128);var cols=['#ffd9a0','#ffc4d6','#d9e4ff','#fff1c9'];
for(var j=0;j<12;j++)for(var i=0;i<5;i++){if(Math.random()<.5){x.fillStyle=cols[Math.random()*4|0];x.fillRect(4+i*12,4+j*10,7,6)}}
var t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return t}
var bmats=[0,1,2,3].map(function(){var t=winTex();return new THREE.MeshLambertMaterial({map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.55})});
var blds=[],LTOT={};
[-1,1].forEach(function(side){var z=25;while(z>-230){var dp=8+Math.random()*8,w=6+Math.random()*5,h=18+Math.random()*34;
  var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,dp),bmats[Math.random()*4|0]);
  b.position.set(side*(5+w/2+Math.random()*1.5),h/2-1,z-dp/2);b.userData={dp:dp,side:side};scene.add(b);blds.push(b);z-=dp+.6}
  LTOT[side]=25-z});

// dog
var dog=new THREE.Group(),legs=[];
var dm=new THREE.MeshLambertMaterial({color:0x3d2226});
function sph(r,sx,sy,sz,x,y,z){var m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),dm);m.scale.set(sx,sy,sz);m.position.set(x,y,z);dog.add(m);return m}
var body=sph(.8,1,.9,1.35,0,1.35,0);
sph(.55,1,1,1,0,1.95,-1.05);
var harn=new THREE.Mesh(new THREE.TorusGeometry(.78,.09,8,24),new THREE.MeshLambertMaterial({color:0xf5a82e}));harn.position.set(0,1.4,-.2);harn.rotation.y=Math.PI/2;harn.scale.set(1,1,1);dog.add(harn);
[-1,1].forEach(function(s){var e=new THREE.Mesh(new THREE.ConeGeometry(.2,.5,8),dm);e.position.set(s*.38,2.45,-1.0);e.rotation.z=-s*.35;dog.add(e)});
var tail=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.8,8),dm);tail.position.set(0,1.9,.95);tail.rotation.x=-.8;dog.add(tail);
[[-.45,-.6],[.45,-.6],[-.45,.65],[.45,.65]].forEach(function(p,i){var g=new THREE.Group();g.position.set(p[0],.95,p[1]);
  var l=new THREE.Mesh(new THREE.CylinderGeometry(.12,.1,.95,8),dm);l.position.y=-.45;g.add(l);
  var f=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),dm);f.position.y=-.92;g.add(f);dog.add(g);legs.push(g)});
var blob=new THREE.Mesh(new THREE.CircleGeometry(1.1,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
blob.rotation.x=-Math.PI/2;blob.scale.set(1,1.6,1);blob.position.y=.03;dog.add(blob);
scene.add(dog);

// coins
var texCache={};
function fracTex(n,d){var k=n+'/'+d;if(texCache[k])return texCache[k];
  var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');
  var g=x.createRadialGradient(128,110,20,128,128,128);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#f2a516');
  x.fillStyle=g;x.beginPath();x.arc(128,128,126,0,7);x.fill();
  x.strokeStyle='#b8730b';x.lineWidth=10;x.beginPath();x.arc(128,128,112,0,7);x.stroke();
  x.fillStyle='#4a2a08';x.textAlign='center';x.textBaseline='middle';
  var fs=(n>9||d>9)?92:108;x.font='900 '+fs+'px "Noto Sans TC",sans-serif';
  x.fillText(n,128,84);x.fillText(d,128,184);x.fillRect(56,128,144,12);
  var t=new THREE.CanvasTexture(c);t.anisotropy=4;texCache[k]=t;return t}
var coinGeo=new THREE.CylinderGeometry(1,1,.2,28),faceGeo=new THREE.CircleGeometry(.98,28),sideMat=new THREE.MeshLambertMaterial({color:0xd98f10,emissive:0x5a3500});
function makeCoin(fr){var g=new THREE.Group();var c=new THREE.Mesh(coinGeo,sideMat);c.rotation.x=Math.PI/2;g.add(c);
  var f=new THREE.Mesh(faceGeo,new THREE.MeshBasicMaterial({map:fracTex(fr[0],fr[1]),transparent:true}));f.position.z=.11;g.add(f);
  var f2=f.clone();f2.rotation.y=Math.PI;f2.position.z=-.11;g.add(f2);return g}

function isProper(f){return f[0]<f[1]}
function rnd(a){return Math.floor(Math.random()*a)}
function genProper(dm){var d=2+rnd(dm-1);return [1+rnd(d-1),d]}
function genImproper(dm){var d=2+rnd(dm-1);return [d+rnd(d+1),d]}

// state
var mode='menu',lv=1,lives=3,got=0,lane=1,rows=[],gotList=[],toastT=0;
function spawnRow(){
  var L=LV[lv],lanes=[0,1,2].sort(function(){return Math.random()-.5}).slice(0,L.per),frs=[],pi=rnd(L.per),tries=0;
  while(tries++<30){frs=lanes.map(function(_,i){
      if(L.per==1)return Math.random()<.55?genProper(L.dmax):genImproper(L.dmax);
      return i==pi?genProper(L.dmax):genImproper(L.dmax)});
    var vs=frs.map(function(f){return f[0]/f[1]});
    if(new Set(vs).size==vs.length)break}
  var g=new THREE.Group(),coins=[];
  lanes.forEach(function(ln,i){var m=makeCoin(frs[i]);m.position.set(LANES[ln],1.5,0);g.add(m);coins.push({lane:ln,fr:frs[i],mesh:m})});
  g.position.z=-70;scene.add(g);rows.push({z:-70,g:g,coins:coins,done:false})}
function clearRows(){rows.forEach(function(r){scene.remove(r.g)});rows=[]}

function buildHud(){$('lvname').textContent='小黑分數跑酷 ▪ '+LV[lv].name;drawHearts();
  var s=$('slots');s.innerHTML='';for(var i=0;i<LV[lv].goal;i++){var d=document.createElement('div');d.className='slot';d.id='s'+i;s.appendChild(d)}}
function drawHearts(){$('hearts').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(3-Math.max(lives,0))}
function toast(msg,cls){var t=$('toast');t.textContent=msg;t.className='show '+cls;toastT=2.2}

function start(n){lv=n;lives=3;got=0;lane=1;clearRows();buildHud();
  $('menu').classList.add('hide');$('end').classList.add('hide');$('hud').classList.remove('hide');$('pad').classList.add('on');
  mode='play';spawnRow()}
function finish(win){mode='end';$('hud').classList.add('hide');$('toast').className='';
  $('etitle').textContent=win?'過關了!':'再試一次';
  $('etitle').style.color=win?'var(--org)':'var(--pink)';
  $('emsg').textContent=win?'你收集了 '+LV[lv].goal+' 枚真分數金幣,小黑跑得好開心。記得:分子比分母小,才是真分數。':'小黑累壞了。提醒你:分子大於或等於分母的是假分數,要閃開;分子比分母小的才是真分數。';
  $('end').classList.remove('hide')}
function toMenu(){mode='menu';clearRows();$('end').classList.add('hide');$('menu').classList.remove('hide');$('hud').classList.add('hide');$('pad').classList.remove('on')}

function eat(c){
  var n=c.fr[0],d=c.fr[1];c.mesh.visible=false;
  if(isProper(c.fr)){
    var el=$('s'+got);el.textContent=n+'/'+d;el.classList.add('on');got++;
    toast('✔ '+n+'/'+d+':分子比分母小,是真分數!','good');
    if(got>=LV[lv].goal)setTimeout(function(){finish(true)},500)
  }else{
    lives--;drawHearts();
    toast('✘ '+n+'/'+d+':分子'+(n==d?'等於':'大於')+'分母,是假分數,要閃開!','bad');
    if(lives<=0)setTimeout(function(){finish(false)},700)
  }}

function move(dir){if(mode!=='play')return;lane=Math.max(0,Math.min(2,lane+dir))}
addEventListener('keydown',function(e){var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){move(-1);e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){move(1);e.preventDefault()}
  else if(mode==='menu'&&'123'.indexOf(k)>=0&&k)start(+k)});
var tx=null;
addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>30)move(dx>0?1:-1);tx=null},{passive:true});
$('bl').addEventListener('click',function(){move(-1)});$('br').addEventListener('click',function(){move(1)});
document.querySelectorAll('.card').forEach(function(b){b.addEventListener('click',function(){start(+b.dataset.lv)})});
$('again').addEventListener('click',function(){start(lv)});$('home').addEventListener('click',toMenu);

var clock=new THREE.Clock(),T=0;
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.05);T+=dt;
  var sp=mode==='play'?LV[lv].speed:(mode==='end'?0:4);
  dashes.forEach(function(d){d.position.z+=sp*dt;if(d.position.z>12)d.position.z-=192});
  blds.forEach(function(b){b.position.z+=sp*dt;if(b.position.z-b.userData.dp/2>25)b.position.z-=LTOT[b.userData.side]});
  // dog
  var tgt=LANES[lane];dog.position.x+=(tgt-dog.position.x)*Math.min(1,dt*12);dog.rotation.z=(tgt-dog.position.x)*.12;
  var run=sp>0?1:.1;
  legs.forEach(function(l,i){l.rotation.x=Math.sin(T*(8+sp*.4)+(i%2?0:Math.PI)+(i>1?Math.PI/2:0))*.8*run});
  dog.position.y=Math.abs(Math.sin(T*(8+sp*.4)))*.12*run;tail.rotation.z=Math.sin(T*10)*.4;
  if(mode==='play'){
    var L=LV[lv];
    if(rows.length===0||rows[rows.length-1].z>-70+L.gap)spawnRow();
    for(var i=rows.length-1;i>=0;i--){var r=rows[i];r.z+=sp*dt;r.g.position.z=r.z;
      r.coins.forEach(function(c){c.mesh.position.y=1.5+Math.sin(T*3+c.lane)*.12});
      if(!r.done&&r.z>-.8){r.done=true;
        for(var k=0;k<r.coins.length;k++){var c=r.coins[k];if(c.mesh.visible&&Math.abs(dog.position.x-LANES[c.lane])<1.3){eat(c);break}}}
      if(r.z>9){scene.remove(r.g);rows.splice(i,1)}}
  }
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').className=''}
  renderer.render(scene,camera);
}
loop();
})();
</script>
</body>
</html>
